[package]
name = "streamdash"
version = "1.9.0"
description = "A private real-time Twitch and StreamElements activity dashboard"
authors = ["Tenkayro"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streamdash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-updater = "2.14.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation_Collections",
  "Services_Store",
  "Win32_Foundation",
  "Win32_Storage_Packaging_Appx",
] }

[profile.dev]
# Skip debug symbols during development: faster linking and startup.
debug = 0

