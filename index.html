<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/streamdash-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Wix+Madefor+Display:wght@500;600&family=Wix+Madefor+Text:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #141518;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 50% at 50% 48%, rgba(139, 92, 246, 0.08), transparent 70%),
          linear-gradient(145deg, #15161a 0%, #111215 55%, #17181d 100%);
        transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .lifecycle-screen {
        animation: boot-overlay-in 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: boot-content-in 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-splash[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash[data-hidden="true"] .boot-splash-content {
        transform: scale(0.985);
        transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .boot-logo-stage {
        position: relative;
        width: min(64vw, 310px);
        max-width: 100%;
      }
      .boot-logo-stage img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      .boot-logo-base {
        filter: grayscale(1) brightness(0.65) contrast(1.05);
        opacity: 0.3;
      }
      .boot-logo-fill {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 44%, transparent 56%, transparent 100%);
        mask-image: linear-gradient(90deg, #000 0%, #000 44%, transparent 56%, transparent 100%);
        -webkit-mask-size: 240% 100%;
        mask-size: 240% 100%;
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: boot-logo-reveal 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .boot-status {
        margin-top: 22px;
        color: #b7bcc7;
        font: 500 12.5px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.015em;
      }
      .boot-meta {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 5px;
        color: #6b707b;
        font: 500 11px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.03em;
      }
      @keyframes boot-overlay-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes boot-content-in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes boot-logo-reveal {
        from {
          -webkit-mask-position: 100% 0;
          mask-position: 100% 0;
        }
        to {
          -webkit-mask-position: 0% 0;
          mask-position: 0% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lifecycle-screen,
        .boot-splash-content { animation: none; }
        .boot-logo-fill {
          animation: none;
          -webkit-mask-image: none;
          mask-image: none;
        }
        .boot-splash,
        .boot-splash[data-hidden="true"] .boot-splash-content { transition: none; }
      }
      [data-animations="off"].lifecycle-screen,
      [data-animations="off"] .boot-splash-content { animation: none; }
      [data-animations="off"] .boot-logo-fill {
        animation: none;
        -webkit-mask-image: none;
        mask-image: none;
      }
      html.tray-window .boot-splash {
        display: none;
      }
    </style>
    <title>StreamDash</title>
