<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/streamdash-icon.png" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/streamdash-logo-boot.webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b0c0f;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0b0c0f;
        transition: opacity 180ms ease-out;
      }
      .boot-splash[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash img {
        width: min(70vw, 360px);
        height: auto;
        object-fit: contain;
      }
      html.tray-window .boot-splash {
        display: none;
      }
    </style>
    <title>StreamDash</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" class="boot-splash" aria-hidden="true">
      <img src="/streamdash-logo-boot.webp" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
