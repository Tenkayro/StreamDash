<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/streamdash-icon.png" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/streamdash-logo-boot.webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b0c0f;
      }
      .boot-splash {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
      }
      .boot-splash img {
        width: min(70vw, 360px);
        height: auto;
        object-fit: contain;
      }
    </style>
    <title>StreamDash</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/streamdash-logo-boot.webp" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
