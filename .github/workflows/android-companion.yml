name: Android Companion APK

on:
  push:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-companion/**/*.gradle*', 'android-companion/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests & build Debug APK
        working-directory: android-companion
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Build Signed Release APK (when signing secrets configured)
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: /tmp/streamdash-release.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon
            rm -f "$ANDROID_KEYSTORE_PATH"
          else
            echo "Skipping signed release APK (ANDROID_KEYSTORE_BASE64 not set)."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdash-companion-apk
          path: |
            android-companion/app/build/outputs/apk/debug/*.apk
            android-companion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
