name: Release All Platforms

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.13.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag & version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "StreamDash $VERSION" \
              --draft \
              --generate-notes
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed Windows MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run setup

      - name: Package Microsoft Store MSIX (private artifact)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msix.ps1 -SkipBuild

      - name: Upload private Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamDash-Store-MSIX-${{ needs.create-release.outputs.tag }}
          path: src-tauri/target/release/bundle/msix/StreamDash-Store.msix
          retention-days: 30

      - name: Generate updater manifest (latest.json)
        shell: pwsh
        run: |
          $tag = "${{ needs.create-release.outputs.tag }}"
          $version = "${{ needs.create-release.outputs.version }}"
          $repo = "${{ github.repository }}"
          $bundleDir = "src-tauri/target/release/bundle/msi"
          $sig = (Get-Content -Raw -LiteralPath "$bundleDir/StreamDash-Setup.msi.sig").Trim()
          $manifest = @{
            version = $version
            notes = "StreamDash $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/$repo/releases/download/$tag/StreamDash-Setup.msi"
              }
            }
          } | ConvertTo-Json -Depth 4
          Set-Content -LiteralPath "$bundleDir/latest.json" -Value "$manifest`n" -Encoding UTF8

      - name: Upload Windows installer & updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" `
            "src-tauri/target/release/bundle/msi/StreamDash-Setup.msi" `
            "src-tauri/target/release/bundle/msi/StreamDash-Setup.msi.sig" `
            "src-tauri/target/release/bundle/msi/latest.json" `
            --clobber --repo "${{ github.repository }}"

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libssl-dev \
            libdbus-1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages (.AppImage, .deb, .rpm)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Upload Linux packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ASSETS=(
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No Linux bundle artifacts found!" >&2
            exit 1
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (Universal macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS Universal (.dmg & .app.tar.gz)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Upload macOS packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ASSETS=(
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No macOS bundle artifacts found!" >&2
            exit 1
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"

  publish-release:
    needs: [create-release, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --draft=false \
            --latest \
            --repo "${{ github.repository }}"
