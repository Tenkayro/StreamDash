name: Release All Platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v2.4.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag & version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "StreamDash $VERSION" \
              --draft \
              --generate-notes
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Tauri bundler tools (WiX)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-windows-wix314-v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          cache-on-failure: true

      - name: Install frontend dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build signed Windows MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run setup

      - name: Package Microsoft Store MSIX (private artifact)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-msix.ps1 -SkipBuild

      - name: Upload private Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamDash-Store-MSIX-${{ needs.create-release.outputs.tag }}
          path: src-tauri/target/release/bundle/msix/StreamDash-Store.msix
          retention-days: 30

      - name: Save Windows updater metadata
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/msi"
          $sig = (Get-Content -Raw -LiteralPath "$bundleDir/StreamDash-Setup.msi.sig").Trim()
          $meta = @{
            "windows-x86_64" = @{
              filename = "StreamDash-Setup.msi"
              signature = $sig
            }
          } | ConvertTo-Json -Depth 4
          Set-Content -LiteralPath "updater-meta-windows.json" -Value $meta -Encoding UTF8

      - name: Upload Windows updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-meta-windows
          path: updater-meta-windows.json
          retention-days: 1

      - name: Upload Windows installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" `
            "src-tauri/target/release/bundle/msi/StreamDash-Setup.msi" `
            "src-tauri/target/release/bundle/msi/StreamDash-Setup.msi.sig" `
            --clobber --repo "${{ github.repository }}"

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libssl-dev \
            libdbus-1-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Tauri bundler tools (AppImage / linuxdeploy)
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-linux-v1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux
          cache-on-failure: true

      - name: Install frontend dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Linux packages (.AppImage, .deb, .rpm)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Save Linux updater metadata
        shell: bash
        run: |
          shopt -s nullglob
          APPIMAGES=(src-tauri/target/release/bundle/appimage/*.AppImage)
          SIGS=(src-tauri/target/release/bundle/appimage/*.AppImage.sig)
          if [ ${#APPIMAGES[@]} -gt 0 ] && [ ${#SIGS[@]} -gt 0 ]; then
            FILENAME="$(basename "${APPIMAGES[0]}")"
            SIG="$(cat "${SIGS[0]}" | tr -d '\r\n')"
            python3 -c 'import json, sys; print(json.dumps({"linux-x86_64": {"filename": sys.argv[1], "signature": sys.argv[2]}}))' "$FILENAME" "$SIG" > updater-meta-linux.json
          else
            echo '{}' > updater-meta-linux.json
          fi

      - name: Upload Linux updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-meta-linux
          path: updater-meta-linux.json
          retention-days: 1

      - name: Upload Linux packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ASSETS=(
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No Linux bundle artifacts found!" >&2
            exit 1
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Rust (Universal macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-universal
          cache-on-failure: true

      - name: Install frontend dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build macOS Universal (.dmg & .app.tar.gz)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Save macOS updater metadata
        shell: bash
        run: |
          shopt -s nullglob
          TARS=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          SIGS=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig)
          if [ ${#TARS[@]} -gt 0 ] && [ ${#SIGS[@]} -gt 0 ]; then
            FILENAME="$(basename "${TARS[0]}")"
            SIG="$(cat "${SIGS[0]}" | tr -d '\r\n')"
            python3 -c 'import json, sys; entry={"filename": sys.argv[1], "signature": sys.argv[2]}; print(json.dumps({"darwin-aarch64": entry, "darwin-x86_64": entry}))' "$FILENAME" "$SIG" > updater-meta-macos.json
          else
            echo '{}' > updater-meta-macos.json
          fi

      - name: Upload macOS updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-meta-macos
          path: updater-meta-macos.json
          retention-days: 1

      - name: Upload macOS packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ASSETS=(
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No macOS bundle artifacts found!" >&2
            exit 1
          fi
          gh release upload "${{ needs.create-release.outputs.tag }}" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"

  build-android-companion:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-companion/**/*.gradle*', 'android-companion/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build Android Companion APK
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: /tmp/streamdash-release.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            ./gradlew assembleRelease --no-daemon
            rm -f "$ANDROID_KEYSTORE_PATH"
            cp app/build/outputs/apk/release/app-release.apk "../StreamDash-Companion-${TAG}.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../StreamDash-Companion-${TAG}.apk"
          fi
          cp "../StreamDash-Companion-${TAG}.apk" "../StreamDash-Companion.apk"
          cat > ../companion-latest.json <<EOF
          {"version":"${VERSION}","tag":"${TAG}","url":"https://github.com/${{ github.repository }}/releases/download/${TAG}/StreamDash-Companion-${TAG}.apk"}
          EOF

      - name: Upload Companion APK to Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" "StreamDash-Companion-${TAG}.apk" "StreamDash-Companion.apk" "companion-latest.json" --clobber --repo "${{ github.repository }}"

  publish-release:
    needs: [create-release, build-windows, build-linux, build-macos, build-android-companion]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download updater metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-meta-*
          merge-multiple: true

      - name: Build unified multi-platform latest.json
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import glob, json

          tag = "${{ needs.create-release.outputs.tag }}"
          version = "${{ needs.create-release.outputs.version }}"
          repo = "${{ github.repository }}"

          platforms = {}
          for path in sorted(glob.glob("updater-meta-*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              for key, info in data.items():
                  platforms[key] = {
                      "signature": info["signature"],
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{info['filename']}",
                  }

          manifest = {
              "version": version,
              "notes": f"StreamDash {version}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Upload latest.json & publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
